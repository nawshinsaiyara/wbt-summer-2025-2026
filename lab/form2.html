<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form2</title>
</head>
<body>
    <form method="post">
        <h3>Registration</h3>
        <p>Please complete all fields below.</p>
        <hr>
        <div class="field">
            <label for="full name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Jon Doe"></input>
            
        </div>

        <div class="field">
            <label for="Postal Code">Postal Code</label>
            <input type="number" min="500" max="55555" placeholder="100001"></input>
            
        </div>
         <div class="field">
            <label for="date of birth">Date of Birth</label>
            <input type="datetime-local" id="date" name="date"></input>
            
        </div>
         <div class="field">
            <label for="Email">Email</label>
            <input type="email" id="email" name="email" placeholder="jondoe@gmail.com"></input>
            
        </div>
         <div class="field">
            <label for="Password">Password</label>
            <input type="password" id="password" name="password" placeholder="******"></input>
            
        </div>
         <div class="field">
            <label for="Country">Country</label>
            <select id="country" name="country">
                <option>Select a country</option>
                <option>USA</option>
                <option>Bangladesh</option>
                <option>UK</option>
                <option>Canada</option>
            </select>
            
        </div>
         <div class="button">
            <button type="submit" class="btn-primary">Submit</button>
            <button type="reset" class="btn-secondary">Reset</button>
            
            
        </div>

    </form>
</body>
</html>
